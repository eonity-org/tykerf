<style>
:scope { background: var(--section-bg, var(--color-bg)); border-bottom: 1px solid var(--color-border); }
.wrap { max-width: var(--max-width); margin: 0 auto; padding: 14px var(--gap); display: flex; flex-wrap: wrap; align-items: center; gap: 12px 36px; }
.brand { display: inline-flex; align-items: center; gap: 10px; font: var(--weight-heading) 19px/1 var(--font-heading); letter-spacing: var(--tracking-heading); color: var(--color-text); text-decoration: none; }
.mark { width: 22px; height: 22px; border-radius: 7px; background: var(--color-text); }
nav { display: flex; flex-wrap: wrap; gap: 6px 28px; margin-right: auto; }
nav a { color: var(--color-muted); text-decoration: none; font-size: 15px; font-weight: 500; }
nav a:hover { color: var(--color-text); }
/* narrow: brand and button on one line, the links under them */
@media (max-width: 640px) { nav { order: 3; width: 100%; margin-right: 0; } .cta { margin-left: auto; } }
.cta { padding: 9px 18px; border-radius: var(--radius-button); background: var(--color-text); color: var(--color-bg); font-size: 15px; font-weight: 600; text-decoration: none; }
</style>
<div class="wrap">
  <a class="brand" href="#"><span class="mark" aria-hidden="true"></span>Site name</a>
  <nav aria-label="Main">
    <a href="#">Page one</a>
    <a href="#">Page two</a>
    <a href="#">Page three</a>
    <a href="#">Page four</a>
  </nav>
  <a class="cta" href="#">Contact</a>
</div>

<style>
:scope { background: var(--section-bg, transparent); }
.wrap { max-width: var(--max-width); margin: 0 auto; padding: var(--space-section) var(--gap); }
.big { max-width: 900px; margin: 0 auto clamp(48px, 6vw, 80px); text-align: center; }
.big blockquote { margin: 0 0 24px; font: 400 clamp(26px, 3.4vw, 40px)/1.3 var(--font-accent); letter-spacing: -0.01em; }
.big figcaption { color: var(--color-muted); }
.big b { color: var(--color-text); font-weight: 600; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 16px; }
figure { margin: 0; }
.grid figure { padding: 28px; border-radius: var(--radius); background: var(--color-surface); border: 1px solid var(--color-border); display: flex; flex-direction: column; gap: 20px; }
.grid blockquote { margin: 0; }
.grid figcaption { display: flex; align-items: center; gap: 12px; margin-top: auto; color: var(--color-muted); font-size: 15px; }
.grid img { width: 40px; height: 40px; border-radius: 50%; }
.grid b { display: block; color: var(--color-text); font-weight: 600; }
</style>
<div class="wrap">
  <figure class="big">
    <blockquote>“The quote that sums up why people love it, in their own words.”</blockquote>
    <figcaption><b>Customer name</b> · Role, company</figcaption>
  </figure>
  <div class="grid">
    <figure><blockquote>“A short quote about a different benefit than the big one.”</blockquote><figcaption><img src="assets/placeholder-avatar.svg" alt=""><span><b>Customer name</b>Role, company</span></figcaption></figure>
    <figure><blockquote>“Another quote that answers a doubt new visitors often have.”</blockquote><figcaption><img src="assets/placeholder-avatar.svg" alt=""><span><b>Customer name</b>Role, company</span></figcaption></figure>
    <figure><blockquote>“A third, ideally with a number: hours saved, sales won.”</blockquote><figcaption><img src="assets/placeholder-avatar.svg" alt=""><span><b>Customer name</b>Role, company</span></figcaption></figure>
  </div>
</div>

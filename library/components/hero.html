<style>
:scope { background: var(--section-bg, transparent); overflow: hidden; }
.wrap { position: relative; max-width: var(--max-width); margin: 0 auto; padding: calc(var(--space-section) * .8) var(--gap) 0; text-align: center; }
/* a soft glow of the accent behind the headline and the picture */
.wrap::before { content: ""; position: absolute; inset: 8% 0 auto; height: 70%; background: radial-gradient(50% 50% at 50% 50%, var(--color-soft), transparent 70%); z-index: -1; }
.badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px 6px 6px; border: 1px solid var(--color-border); border-radius: var(--radius-button); background: var(--color-bg); font-size: 14px; color: var(--color-muted); text-decoration: none; }
.badge b { padding: 3px 10px; border-radius: var(--radius-button); background: var(--color-accent); color: var(--color-on-accent); font-size: 12px; font-weight: 600; }
h1 { font-size: var(--text-hero); max-width: 14ch; margin: 28px auto 24px; }
.lead { font-size: var(--text-lead); color: var(--color-muted); max-width: 40em; margin: 0 auto 36px; }
.actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
.button { display: inline-flex; align-items: center; padding: 14px 26px; border-radius: var(--radius-button); font-weight: 600; text-decoration: none; }
.primary { background: var(--color-accent); color: var(--color-on-accent); }
.secondary { background: var(--color-bg); color: var(--color-text); border: 1px solid var(--color-border); }
.note { margin: 18px 0 0; font-size: 14px; color: var(--color-muted); }
.shot { margin: clamp(48px, 7vw, 88px) auto 0; max-width: 1080px; padding: 10px 10px 0; border: 1px solid var(--color-border); border-bottom: 0; border-radius: calc(var(--radius) + 10px) calc(var(--radius) + 10px) 0 0; background: color-mix(in srgb, var(--color-bg) 70%, transparent); box-shadow: 0 30px 80px -30px color-mix(in srgb, var(--color-text) 30%, transparent); }
.shot img { display: block; width: 100%; border-radius: var(--radius) var(--radius) 0 0; }
</style>
<div class="wrap">
  <a class="badge" href="#"><b>New</b>Introducing the next version →</a>
  <h1>The short promise of your product</h1>
  <p class="lead">One or two sentences that say what it does, who it is for, and why it is better than what they use today.</p>
  <div class="actions">
    <a class="button primary" href="#">Get started free</a>
    <a class="button secondary" href="#">Book a demo</a>
  </div>
  <p class="note">Free for 14 days · No credit card</p>
  <div class="shot"><img src="assets/mockup-app.svg" alt="A screenshot of the product"></div>
</div>

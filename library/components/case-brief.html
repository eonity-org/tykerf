<style>
:scope { background: var(--section-bg, transparent); }
.wrap { max-width: var(--max-width); margin: 0 auto; padding: calc(var(--space-section) * .7) var(--gap); }

.n { font: var(--weight-heading) 15px/1 var(--font-heading); color: var(--color-accent); }

li p { margin: 0; color: var(--color-muted); }
</style>
<div class="wrap">
  <h2>The story in three parts</h2>
  <ol>
    <li><span class="n">01</span><h3>The brief</h3><p>What the client asked for, and the problem behind the request.</p></li>
    <li><span class="n">02</span><h3>What we did</h3><p>The work itself: what was made, with whom, and in what order.</p></li>
    <li><span class="n">03</span><h3>What changed</h3><p>What the client can do now that they couldn't before.</p></li>
  </ol>
</div>

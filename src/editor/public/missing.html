<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TYKERF · page not found</title>
<link rel="icon" href="/_tykerf/favicon.svg" type="image/svg+xml">
<style>
  /* IBM Plex, bundled with TYKERF (SIL OFL), as on the start screen */
  @font-face { font-family: tykerf-plex-sans; src: url('/_tykerf/fonts/IBMPlexSans-Regular-Latin1.woff2') format('woff2'); font-weight: 400; }
  @font-face { font-family: tykerf-plex-sans; src: url('/_tykerf/fonts/IBMPlexSans-SemiBold-Latin1.woff2') format('woff2'); font-weight: 600; }
  html, body { margin: 0; min-height: 100%; }
  body { background: #F2F7F9; font-family: tykerf-plex-sans, system-ui, sans-serif; color: #10303F; line-height: 1.5; }
  header { display: flex; align-items: center; gap: 12px; padding: 12px 20px; background: #0A5475; color: #fff; }
  header svg { width: 22px; height: 22px; fill: #fff; }
  header svg .focus { fill: #EA9A27; }
  header b { font-size: 17px; letter-spacing: .01em; }
  main { max-width: 560px; margin: 48px auto; padding: 0 20px; }
  .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 6px 24px rgb(0 0 0 / .08); }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 8px; }
  p { margin: 0 0 12px; color: #3B5866; }
  code { font-size: .92em; background: #E6EFF3; border-radius: 4px; padding: 1px 5px; overflow-wrap: anywhere; }
  h2 { font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: #3B5866; margin: 20px 0 8px; }
  ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
  ul a { display: block; padding: 8px 12px; border-radius: 8px; background: #F2F7F9; color: #0A5475; font-weight: 600; text-decoration: none; }
  ul a:hover, ul a:focus-visible { background: #E0EDF3; }
  .none { color: #3B5866; }
  @media (prefers-color-scheme: dark) {
    body { background: #0B1D26; color: #EAF3F7; }
    .card { background: #12303D; box-shadow: none; }
    p, h2, .none { color: #B5CCD6; }
    code { background: #0B1D26; }
    ul a { background: #0B1D26; color: #8FD0EC; }
    ul a:hover, ul a:focus-visible { background: #18404F; }
  }
</style>
</head>
<body>
<header>
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="20" rx="6"/><rect y="27" width="28.5" height="37" rx="6"/><rect class="focus" x="35.5" y="27" width="28.5" height="12" rx="3"/><rect x="35.5" y="45" width="11.25" height="19" rx="3"/><rect x="52.75" y="45" width="11.25" height="19" rx="3"/></svg>
  <b>tykerf</b>
</header>
<main>
  <div class="card">
    <h1 data-t>This page isn't in the site any more</h1>
    <p class="where"></p>
    <p data-t>It was probably renamed or removed, perhaps in another tab. A removed page is kept in the site's .trash folder.</p>
    <h2 data-t>The site's pages</h2>
    <ul></ul>
  </div>
</main>
<script type="module">
// the same language rules as the editor: English text is the key, a catalog replaces it
let lang = 'en';
try { lang = String(JSON.parse(localStorage.getItem('tykerf.lang')) ?? navigator.language ?? 'en').slice(0, 2).toLowerCase(); } catch { lang = String(navigator.language ?? 'en').slice(0, 2).toLowerCase(); }
const catalog = lang === 'en' ? {} : await fetch(`/_tykerf/i18n/${lang}.json`).then((r) => r.json()).catch(() => ({}));
const t = (text, vars = {}) => (catalog[text] || text).replace(/\{(\w+)\}/g, (m, k) => (k in vars ? String(vars[k]) : m));
for (const el of document.querySelectorAll('[data-t]')) el.textContent = t(el.textContent);
document.title = t('TYKERF · page not found');

const code = document.createElement('code');
code.textContent = decodeURIComponent(location.pathname);
const [before, after = ''] = t('Nothing is at {address}.').split('{address}');
document.querySelector('.where').append(before, code, after);

const site = await fetch('/_tykerf/site').then((r) => r.json()).catch(() => ({}));
const list = document.querySelector('ul');
for (const page of site.pages ?? []) {
  const a = Object.assign(document.createElement('a'), { href: `/${encodeURIComponent(page)}/`, textContent: page });
  list.append(document.createElement('li'));
  list.lastElementChild.append(a);
}
if (!site.pages?.length) {
  const none = Object.assign(document.createElement('p'), { className: 'none', textContent: `${t('The site has no pages yet.')} ` });
  none.append(Object.assign(document.createElement('a'), { href: '/_tykerf/site/', textContent: t('Make its first page') }));
  list.replaceWith(none);
}
</script>
</body>
</html>

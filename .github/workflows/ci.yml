name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the editor, export, boxes and design tests drive a real Chromium
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm test

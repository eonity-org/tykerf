<h3>Questions</h3>
<details open><summary>Can a box hold any HTML?</summary><p>Yes: markup, its own CSS and its own scripts.</p></details>
<details><summary>Do styles leak between boxes?</summary><p>No. A box's &lt;style&gt; is scoped to that box with CSS @scope.</p></details>
<details><summary>What happens when I move a box?</summary><p>Its code moves with it; only the tree changes.</p></details>
